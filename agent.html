<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能助手</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        /* 移动端常用背景色，避免白屏刺眼 */
        background-color: #f5f5f5; 
      }
    </style>
  </head>
  <body>
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>
    <script>
      // 关键点2：简单的判断逻辑，如果屏幕宽度小于 768px，认为是手机
      const isMobile = window.innerWidth < 768;

      new CozeWebSDK.WebChatClient({
        config: {
          type: 'bot',
          bot_id: '7566232058348044324',
          isIframe: false,
        },
        auth: {
          type: 'token',
          // 安全提示：生产环境中请勿将 Token 直接暴露在前端代码中
          token: 'pat_yOr4bTC9i2dLrWrVdQ8tnebgx4bbMxLZL0wGUDIegnGZPUigWuB11Jet0qjQFiwC',
          onRefreshToken: async () => 'token'
        },
        userInfo: {
          id: 'user',
          url: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/coze-logo.png',
          // 关键点3：汉化用户昵称
          nickname: '访客', 
        },
        ui: {
          base: {
            icon: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/chatsdk-logo.png',
            // 关键点4：根据设备自动切换布局
            // 'mobile' 模式会全屏显示，适合手机；'pc' 模式是右下角弹窗
            layout: isMobile ? 'mobile' : 'pc', 
            // 关键点5：修正语言代码错误 (原代码 zh-CH 是错误的)
            lang: 'zh-CN',
            zIndex: 1000
          },
          header: {
            isShow: true,
            isNeedClose: true, // 手机全屏模式下，关闭按钮通常用来“最小化”或退出
          },
          asstBtn: {
            isNeed: true
          },
          footer: {
            isShow: true,
            // 关键点6：汉化页脚文字
            expressionText: '由 Coze AI 提供技术支持', 
          },
          chatBot: {
            // 关键点7：汉化聊天窗口标题
            title: '智能助手', 
            uploadable: true,
            // PC端保持原宽度，移动端通常SDK会自动自适应，但为了保险可以根据设备设置
            width: isMobile ? '100%' : 390, 
          },
        },
      });
    </script>
  </body>
</html>
